name: Bootstrap watcher fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact watcher.py fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('watcher.py')
          text = path.read_text()
          old = '''MILEAGE_UPPER_RE = re.compile(r"Mileage\\.range\\(\\.\\.\\d+\\)")\n'''
          if old not in text:
              raise SystemExit('expected mileage regex not found')
          text = text.replace(old, '', 1)
          block = '''        forced_mileage = os.getenv("CARTRACK_MAX_MILEAGE_KM", "130000")\n        if forced_mileage:\n            try:\n                forced_mileage_int = int(forced_mileage)\n            except ValueError as exc:\n                raise RuntimeError("CARTRACK_MAX_MILEAGE_KM must be an integer") from exc\n            if forced_mileage_int <= 0:\n                raise RuntimeError("CARTRACK_MAX_MILEAGE_KM must be positive")\n            action = MILEAGE_UPPER_RE.sub(f"Mileage.range(..{forced_mileage_int})", action, count=1)\n\n'''
          if block not in text:
              raise SystemExit('expected hardcoded mileage override not found')
          text = text.replace(block, '', 1)
          path.write_text(text)
          PY
          git diff --check
          grep -q 'CARTRACK_MAX_MILEAGE_KM' watcher.py && exit 1 || true
          grep -q 'MILEAGE_UPPER_RE' watcher.py && exit 1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add watcher.py
          git rm .github/workflows/bootstrap.yml
          git commit -m 'Remove hardcoded mileage override'
          git push origin HEAD:main
