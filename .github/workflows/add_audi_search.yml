name: Add Audi Search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add_audi_search.yml'

concurrency:
  group: cartrack-${{ github.repository }}-schedule
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Checkout encrypted state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Migrate state and add Audi search
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          TELEGRAM_CHAT_ID: ${{ secrets.telegramid }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
          CARTRACK_STATE_FILE: .state/state.enc
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import watcher

          audi = {
            'key': 'owner_audi_a6',
            'label': 'Audi A6 2017+',
            'search_url': 'https://car.encar.com/list/car?page=1&search=%7B%22type%22%3A%22car%22%2C%22action%22%3A%22(And.Hidden.N._.MultiViewHidden.N._.SellType.일반._.(Or.Separation.B._.Separation.F.)_.ServiceCopyCar.ORIGINAL._.FuelType.디젤._.Mileage.range(..110000)._.(C.CarType.N._.(C.Manufacturer.아우디._.(C.ModelGroup.A6._.Model.뉴%20A6.)))_.Year.range(201700..)._.Price.range(..1300).)%22%2C%22title%22%3A%22Audi%20NEW%20A6(04~18년)%22%2C%22toggle%22%3A%7B%7D%2C%22layer%22%3A%22%22%2C%22sort%22%3A%22MobilePriceAsc%22%7D'
          }

          base = json.loads(os.environ['SEARCHES_JSON'])
          extra_path = Path('owner_extra_searches.json')
          extra = json.loads(extra_path.read_text(encoding='utf-8'))
          if any(x.get('key') == audi['key'] for x in extra.get('searches', [])):
              raise SystemExit('Audi search already exists')
          new_extra = dict(extra)
          new_extra['compatibility_note'] = 'Owner-specific URLs are stored 1M KRW below their requested price cap because the existing owner config is legacy format v1; Cartrack adds 1M KRW at runtime.'
          new_extra['searches'] = list(extra['searches']) + [audi]

          merged = dict(base)
          merged['searches'] = list(base['searches']) + new_extra['searches']
          os.environ['SEARCHES_JSON'] = json.dumps(merged, ensure_ascii=False, separators=(',',':'))

          secret = watcher.state_secret()
          state = watcher.decrypt_state(watcher.STATE_FILE.read_bytes(), secret)
          original = {k:set(v.get('seen', [])) for k,v in state.get('searches',{}).items() if isinstance(v,dict)}
          if len(original) < 4:
              raise SystemExit('expected four existing search histories')

          config = watcher.load_config()
          if len(config.searches) != 5:
              raise SystemExit(f'expected 5 searches, got {len(config.searches)}')
          state['config_fingerprint'] = watcher.config_fingerprint(config)
          watcher.save_state(state, secret)

          session = watcher.requests.Session()
          watcher.bootstrap(session)
          for i,spec in enumerate(config.searches,1):
              items = watcher.fetch_search(session,spec)
              print(f'search {i}: {len(items)} results')

          watcher.run_watch(dry_run=False)
          state2 = watcher.load_state(watcher.config_fingerprint(config), secret)
          for key, hashes in original.items():
              if not hashes.issubset(set(state2['searches'].get(key,{}).get('seen',[]))):
                  raise SystemExit(f'history lost for {key}')
          audi_row = state2['searches'].get('owner_audi_a6',{})
          if audi_row.get('initialized') is not True:
              raise SystemExit('Audi search not initialized')

          report = {
            'status':'OK',
            'audi_seen_count':len(audi_row.get('seen',[])),
            'total_searches':len(config.searches),
            'existing_histories_preserved':True
          }
          Path('.state/audi-migration-report.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          extra_path.write_text(json.dumps(new_extra,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add owner_extra_searches.json
          git commit -m 'add Audi A6 monitoring search'
          git push origin HEAD:main

          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.enc audi-migration-report.json
          git commit -m 'initialize Audi A6 monitoring state'
          git pull --rebase origin state
          git push origin HEAD:state
