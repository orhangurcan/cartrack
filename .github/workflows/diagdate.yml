name: Listing Date Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagdate.yml'

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Extract Encar dates privately
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, requests, zlib
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          import watcher

          PUB=b'''-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA3u5/BD01aBLpx1B/RJP3
          GLqgAd5frq9J50htSabRPOTwAYlFDI94tZCm5974ADwMdVIACjYsugbkvG1g2RCQ
          nL4p6/t/Zi3jQ2AkV7zjk0iVRgA1DRrs4TeV6Q0zFxi93F8xrVfj0olgo9aLSR91
          rau66uq5JMgGcfaTcjMOy+fgT6HyLQioy44snHahO3JyxKBSV7Kp6HBpUwNjUeyI
          iHfAHx9fZkfCmeQ9WC20/ellHZ2bou/+/r9T7pra+Y81SA/eTaFPIdSDdCXCkVp8
          WdEJMmGUmRbiv/E0D3Kniug9L2bfJ9NFsmwuGAdN8zhB8PT/Ie5hmWku5iVfTeg5
          aQIDAQAB
          -----END PUBLIC KEY-----'''
          config=watcher.load_config(); spec=config.searches[1]
          s=requests.Session(); watcher.bootstrap(s)
          listings=watcher.fetch_search(s,spec)
          car=next(c for c in listings if str(c.get('Id'))=='41886116')
          wanted={k:car.get(k) for k in ['Id','RegistDate','ModifiedDate','FirstDate','ServiceCopyCar','FormYear','Mileage','Price','Manufacturer','Model','Badge','BadgeDetail']}
          blob=zlib.compress(json.dumps(wanted,ensure_ascii=False,separators=(',',':')).encode(),9)
          pub=serialization.load_pem_public_key(PUB)
          enc=pub.encrypt(blob,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          open('.state/datecheck.txt','w').write(base64.b64encode(enc).decode()+'\n')
          PY
          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datecheck.txt
          git commit -m 'temporary encrypted listing date check'
          git push origin HEAD:state
