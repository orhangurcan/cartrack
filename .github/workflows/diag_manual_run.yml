name: Diagnose Manual Cartrack Run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag_manual_run.yml'

permissions:
  actions: read
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - name: Query target run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 381a299d33f8d74dc32b3f371c42d09762794ff0
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs?per_page=100"
          req=urllib.request.Request(url,headers={
            'Authorization':'Bearer '+os.environ['GH_TOKEN'],
            'Accept':'application/vnd.github+json',
            'User-Agent':'cartrack-manual-diag'
          })
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          matches=[]
          for x in data.get('workflow_runs',[]):
              if x.get('head_sha')==os.environ['TARGET_SHA']:
                  matches.append({
                    'id':x.get('id'),
                    'name':x.get('name'),
                    'event':x.get('event'),
                    'status':x.get('status'),
                    'conclusion':x.get('conclusion'),
                    'created_at':x.get('created_at'),
                    'run_started_at':x.get('run_started_at')
                  })
          open('.state/manual-run-report.json','w').write(json.dumps(matches,indent=2)+'\n')
          PY
          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manual-run-report.json
          git commit -m 'temporary manual run report'
          git push origin HEAD:state
