name: Diagnose Hourly Status
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag_hourly_status.yml'
permissions:
  actions: read
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - name: Query recent hourly runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          targets=[
            "0e415d64f0334152273974aa26d88d60b86ce3aa",
            "829004cda9342ec925237920c751af9707dd8dd1",
            "5081387c153e27b800f03f001f8da2d11c0405bd",
            "fb5c333ebf3b1cd41ba48fc966f7a28ccb53dc13",
            "0ff6326bc77a2fb8cffad5a43750adb6a92316de",
            "23e0295fabe6658403b978a10ad49212bbdec377"
          ]
          url=f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs?event=push&per_page=100"
          req=urllib.request.Request(url,headers={
            "Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "Accept":"application/vnd.github+json",
            "User-Agent":"cartrack-hourly-status"
          })
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          out=[]
          for sha in targets:
              m=[x for x in data.get("workflow_runs",[]) if x.get("head_sha")==sha and x.get("name")=="Cartrack"]
              if m:
                  x=m[0]
                  out.append({
                    "sha":sha,
                    "id":x.get("id"),
                    "status":x.get("status"),
                    "conclusion":x.get("conclusion"),
                    "created_at":x.get("created_at"),
                    "run_started_at":x.get("run_started_at"),
                    "event":x.get("event")
                  })
              else:
                  out.append({"sha":sha,"missing":True})
          open(".state/hourly-status-report.json","w").write(json.dumps(out,indent=2)+"\n")
          PY
          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hourly-status-report.json
          git commit -m 'temporary hourly status report'
          git push origin HEAD:state
