name: Check Current Schedule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag_schedule_now.yml'

permissions:
  actions: read
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - name: Read schedule runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          since='2026-08-25T10:36:52Z'
          url=f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/cartrack.yml/runs?event=schedule&per_page=20"
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'cartrack-check'})
          with urllib.request.urlopen(req,timeout=20) as r: data=json.load(r)
          rows=[]
          for x in data.get('workflow_runs',[]):
              if (x.get('created_at') or '') >= since:
                  rows.append({'created_at':x.get('created_at'),'run_started_at':x.get('run_started_at'),'conclusion':x.get('conclusion'),'status':x.get('status')})
          open('.state/current-15min-runs.json','w').write(json.dumps(rows,indent=2)+'\n')
          PY
          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add current-15min-runs.json
          git commit -m 'temporary current schedule report'
          git push origin HEAD:state
