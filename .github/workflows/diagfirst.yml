name: Cartrack Baseline Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagfirst.yml'

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check candidate in first v4 baseline
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
        shell: bash
        run: |
          git -C .state show f1f67ae172009bfe1b1d6d80fb9ccc9fcd981fd2:state.enc > /tmp/first-state.enc
          python - <<'PY'
          import base64, json, os, subprocess, zlib
          import requests
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          import watcher

          PUB = b'''-----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAqGzVUQwQ2s/+5kuKvrwg
          T4Vn8xg0+XFSlx8n+Bp96FJ+X+1Z0iHrNWLEdIpvdFjKGIWYIs5k0K7a8JeUB81Z
          J6xfPoS+4o2SZTaF/QP6zytHTGmWM7H/4vyzbLiCSTgkXMc40fWf1G9CJqnctocG
          Ggc2Nha/wkUOZVbVhm6OrzgQ/9J65wpKXMOEP/ORH8JrFCyCZgqyADJlKymNCh+n
          MC6tHx+4Yappr5VusTxG5xYjQceBoEneE8wZMjLo2WoWKm0mplRCgN6CPkcJoi0x
          xk1Odjm+ryli/b6YbpypS2GbEDoFoNnbCjeWzmTomB/+9s23xRjDDTdziuqrNg8m
          rN4FRbheSeS705WTXqyJuNkG+eMmkUR3Ui/4Bl3gEd7J4F6IA1CqcDslFRFiP08A
          9aL05H+fvH2XL9Ua7VAYHFYLmNJINpis/TpMKe4fyZ+9sspCNbUkO6H8VWFiplvN
          yECLIwnK/bOAmKtkROtSrCD5mNJQbyeeyFyZ2w71MhvYxYkst9xgxIQPgqu9/TOE
          qLghXUUF36I6cqRc8lYeVvxJ3CpsSoxUUPJZjT2HlaawyWZ1wOWl4qSqLFeo9vbX
          cFRWNcQS8biJFSYBwWee4adhi/ah8PT9/RHaiMiPOcpkVhSZnkJD0AYVnGTsx1xV
          9tx8p5t1RMIgyi4x0Str1oUCAwEAAQ==
          -----END PUBLIC KEY-----'''
          config = watcher.load_config(); spec = config.searches[1]
          secret = watcher.state_secret(); hkey = watcher.derive_key(secret, 'cartrack-listing-hmac-v1')
          session = requests.Session(); watcher.bootstrap(session)
          candidate = watcher.fetch_search(session, spec)[0]
          first_state = watcher.decrypt_state(open('/tmp/first-state.enc','rb').read(), secret)
          row = first_state.get('searches',{}).get(spec.key,{})
          digest = watcher.digest_id(candidate.get('Id'), hkey)
          result = {'id':candidate.get('Id'),'in_first_v4':digest in set(row.get('seen',[])),'first_seen_count':len(row.get('seen',[])),'initialized':row.get('initialized')}
          blob = zlib.compress(json.dumps(result,separators=(',',':')).encode(),9)
          pub = serialization.load_pem_public_key(PUB)
          enc = pub.encrypt(blob,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          open('.state/firstcheck.txt','w').write(base64.b64encode(enc).decode()+'\n')
          PY
          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firstcheck.txt
          git commit -m 'temporary encrypted baseline check'
          git push origin HEAD:state
