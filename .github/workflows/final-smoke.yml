name: Cartrack Final Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-smoke.yml'

concurrency:
  group: cartrack-${{ github.repository }}-final-smoke
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Checkout encrypted state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m compileall -q watcher.py tests
      - run: python -m unittest discover -s tests -v
      - name: Final live validation
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          TELEGRAM_CHAT_ID: ${{ secrets.telegramid }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
          HEALTHCHECK_URL: ${{ secrets.healthcheckurl }}
          HEALTHCHECK_SUCCESS_URL: ${{ secrets.healthcheck_success_url }}
          HEALTHCHECK_FAILURE_URL: ${{ secrets.healthcheck_failure_url }}
          CARTRACK_STATE_FILE: .state/state.enc
        shell: bash
        run: |
          python watcher.py telegram-test
          python watcher.py dry-run
          python watcher.py watch
      - name: Record successful final validation
        shell: bash
        run: |
          cd .state
          printf '{"status":"OK"}\n' > final-smoke.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- state.enc final-smoke.json
          git commit -m 'record final smoke validation' || true
          git pull --rebase origin state
          git push origin HEAD:state
