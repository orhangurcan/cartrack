name: Replace Audi Search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace_audi_search.yml'

concurrency:
  group: cartrack-${{ github.repository }}-schedule
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Checkout encrypted state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Replace Audi search and migrate state
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          TELEGRAM_CHAT_ID: ${{ secrets.telegramid }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
          CARTRACK_STATE_FILE: .state/state.enc
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import watcher

          target_key = 'owner_audi_a6'
          replacement = {
            'key': target_key,
            'label': 'Audi A6 2015/05+',
            'search_url': 'https://car.encar.com/list/car?page=1&search=%7B%22type%22%3A%22car%22%2C%22action%22%3A%22(And.Hidden.N._.MultiViewHidden.N._.SellType.일반._.(Or.Separation.B._.Separation.F.)_.ServiceCopyCar.ORIGINAL._.FuelType.디젤._.Mileage.range(..110000)._.Price.range(..1300)._.(C.CarType.N._.(C.Manufacturer.아우디._.(C.ModelGroup.A6._.(C.Model.뉴%20A6._.(Or.BadgeGroup.디젤%202WD._.BadgeGroup.디젤%204WD.)))))_.Year.range(201505..).)%22%2C%22title%22%3A%22Audi%20NEW%20A6(04~18년)%22%2C%22toggle%22%3A%7B%7D%2C%22layer%22%3A%22%22%2C%22sort%22%3A%22MobilePriceAsc%22%7D'
          }

          extra_path = Path('owner_extra_searches.json')
          extra = json.loads(extra_path.read_text(encoding='utf-8'))
          rows = extra.get('searches', [])
          if sum(1 for x in rows if x.get('key') == target_key) != 1:
              raise SystemExit('expected exactly one Audi search')
          new_rows = [replacement if x.get('key') == target_key else x for x in rows]
          new_extra = dict(extra)
          new_extra['searches'] = new_rows

          base = json.loads(os.environ['SEARCHES_JSON'])
          merged = dict(base)
          merged['searches'] = list(base['searches']) + new_rows
          os.environ['SEARCHES_JSON'] = json.dumps(merged, ensure_ascii=False, separators=(',',':'))

          secret = watcher.state_secret()
          old_state = watcher.decrypt_state(watcher.STATE_FILE.read_bytes(), secret)
          old_searches = old_state.get('searches', {})
          preserved = {k:set(v.get('seen', [])) for k,v in old_searches.items() if k != target_key and isinstance(v,dict)}
          if len(preserved) < 4:
              raise SystemExit('expected four non-Audi histories to preserve')

          config = watcher.load_config()
          if len(config.searches) != 5:
              raise SystemExit(f'expected 5 searches, got {len(config.searches)}')

          old_state['config_fingerprint'] = watcher.config_fingerprint(config)
          old_state['searches'].pop(target_key, None)
          watcher.save_state(old_state, secret)

          session = watcher.requests.Session()
          watcher.bootstrap(session)
          audi_spec = next(s for s in config.searches if s.key == target_key)
          current = watcher.fetch_search(session, audi_spec)
          watcher.run_watch(dry_run=False)

          new_state = watcher.load_state(watcher.config_fingerprint(config), secret)
          for key, hashes in preserved.items():
              if not hashes.issubset(set(new_state['searches'].get(key,{}).get('seen',[]))):
                  raise SystemExit(f'history lost for {key}')
          audi_row = new_state['searches'].get(target_key,{})
          if audi_row.get('initialized') is not True:
              raise SystemExit('Audi search not initialized')

          report = {
            'status':'OK',
            'audi_current_results':len(current),
            'audi_seen_count':len(audi_row.get('seen',[])),
            'total_searches':len(config.searches),
            'other_histories_preserved':True
          }
          Path('.state/audi-replace-report.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          extra_path.write_text(json.dumps(new_extra,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add owner_extra_searches.json
          git commit -m 'replace Audi A6 monitoring filter'
          git push origin HEAD:main

          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.enc audi-replace-report.json
          git commit -m 'initialize replacement Audi A6 state'
          git pull --rebase origin state
          git push origin HEAD:state
