name: Cartrack

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: watch
        type: choice
        options:
          - watch
          - dry-run
          - telegram-test
  push:
    branches: [main]
    paths:
      - 'watcher.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'owner_extra_searches.json'
      - '.hourly-trigger'
      - '.github/workflows/cartrack.yml'
  pull_request:
    branches: [main]
    paths:
      - 'watcher.py'
      - 'tests/**'
      - 'requirements.txt'
      - 'owner_extra_searches.json'
      - '.github/workflows/cartrack.yml'

concurrency:
  group: cartrack-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.head_commit.message != 'hourly cartrack trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m compileall -q watcher.py tests
      - run: python -m unittest discover -s tests -v

  watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'hourly cartrack trigger')
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Checkout encrypted state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: state
          path: .state
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m py_compile watcher.py monthly_report.py

      - name: Run selected mode
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          TELEGRAM_CHAT_ID: ${{ secrets.telegramid }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
          HEALTHCHECK_URL: ${{ secrets.healthcheckurl }}
          HEALTHCHECK_SUCCESS_URL: ${{ secrets.healthcheck_success_url }}
          HEALTHCHECK_FAILURE_URL: ${{ secrets.healthcheck_failure_url }}
          CARTRACK_STATE_FILE: .state/state.enc
        shell: bash
        run: |
          set -euo pipefail
          mode="watch"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          fi

          if [[ "$mode" != "telegram-test" && "${{ github.repository }}" == "sefaangin/cartrack" ]]; then
            python - <<'PY'
          import json, os
          base = json.loads(os.environ['SEARCHES_JSON'])
          extra = json.load(open('owner_extra_searches.json', encoding='utf-8'))
          if not isinstance(base.get('searches'), list) or not isinstance(extra.get('searches'), list):
              raise SystemExit('invalid search configuration')
          base['searches'] = base['searches'] + extra['searches']
          open('/tmp/cartrack-searches.json','w',encoding='utf-8').write(json.dumps(base, ensure_ascii=False, separators=(',',':')))
          PY
            export SEARCHES_JSON="$(cat /tmp/cartrack-searches.json)"
          fi

          if [[ "$mode" == "watch" ]]; then
            python - <<'PY'
          import logging
          import watcher

          original_send_telegram = watcher.send_telegram
          logger = logging.getLogger("cartrack")

          def logged_send_telegram(text: str) -> None:
              logger.info("CARTRACK_NOTIFICATION_BEGIN\n%s\nCARTRACK_NOTIFICATION_END", text)
              original_send_telegram(text)

          watcher.send_telegram = logged_send_telegram
          watcher.run_watch(dry_run=False)
          PY
          else
            python watcher.py "$mode"
          fi

          if [[ "$mode" == "watch" && -f ".monthly-report-trigger" ]]; then
            python monthly_report.py .state/monthly-130k-report.json
          fi

      - name: Persist encrypted state
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'watch') || (github.event_name == 'push' && github.event.head_commit.message == 'hourly cartrack trigger'))
        shell: bash
        run: |
          cd .state
          if [[ -z "$(git status --porcelain -- state.enc monthly-130k-report.json 2>/dev/null || true)" ]]; then
            echo 'State/report unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- state.enc
          if [[ -f monthly-130k-report.json ]]; then git add -- monthly-130k-report.json; fi
          git commit -m 'update runtime state'
          git pull --rebase origin state
          git push origin HEAD:state
