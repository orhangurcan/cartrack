name: Cartrack

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: watch
        type: choice
        options:
          - watch
          - dry-run
          - telegram-test
  push:
    branches: [main]
    paths:
      - 'watcher.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/cartrack.yml'
  pull_request:
    branches: [main]
    paths:
      - 'watcher.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/cartrack.yml'

concurrency:
  group: cartrack-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m compileall -q watcher.py tests
      - run: python -m unittest discover -s tests -v

  watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare encrypted state
        shell: bash
        run: |
          mkdir -p .state
          if ! git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git init .state
            cd .state
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git fetch origin main --depth=1
            git checkout --orphan state
            git rm -rf . >/dev/null 2>&1 || true
            printf '%s\n' '# Runtime state branch' '' 'Encrypted Cartrack runtime state only.' > README.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'initialize encrypted runtime state branch'
            git push origin HEAD:state
            cd ..
          fi
          rm -rf .state
          git clone --depth=1 --branch state "https://github.com/${GITHUB_REPOSITORY}.git" .state

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m py_compile watcher.py

      - name: Validate required configuration
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          TELEGRAM_CHAT_ID: ${{ secrets.telegramid }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
        shell: bash
        run: |
          mode="watch"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          fi

          test -n "$TELEGRAM_BOT_TOKEN" || { echo 'Missing telegrambot secret'; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo 'Missing telegramid secret'; exit 1; }

          if [[ "$mode" == "watch" || "$mode" == "dry-run" ]]; then
            test -n "$SEARCHES_JSON" || { echo 'Missing searchesjson secret'; exit 1; }
            test -n "$STATE_ENCRYPTION_KEY" || { echo 'Missing statekey secret'; exit 1; }
            python - <<'PY'
import json
import os

data = json.loads(os.environ["SEARCHES_JSON"])
if not isinstance(data, dict):
    raise SystemExit("SEARCHES_JSON must be a JSON object")
if int(data.get("format_version", 1)) != 2:
    raise SystemExit("SEARCHES_JSON must use format_version 2")
searches = data.get("searches")
if not isinstance(searches, list) or not searches:
    raise SystemExit("SEARCHES_JSON must contain a non-empty searches list")
for row in searches:
    if not isinstance(row, dict):
        raise SystemExit("Every search config must be an object")
    if not all(isinstance(row.get(key), str) and row[key] for key in ("key", "label", "search_url")):
        raise SystemExit("Each search needs non-empty key, label and search_url")
print(f"Validated SEARCHES_JSON with {len(searches)} search(es).")
PY
          fi

      - name: Run selected mode
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          TELEGRAM_CHAT_ID: ${{ secrets.telegramid }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
          HEALTHCHECK_URL: ${{ secrets.healthcheckurl }}
          HEALTHCHECK_SUCCESS_URL: ${{ secrets.healthcheck_success_url }}
          HEALTHCHECK_FAILURE_URL: ${{ secrets.healthcheck_failure_url }}
          CARTRACK_STATE_FILE: .state/state.enc
        shell: bash
        run: |
          mode="watch"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          fi
          python watcher.py "$mode"

      - name: Persist encrypted state
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'watch'))
        shell: bash
        run: |
          cd .state
          if [[ -z "$(git status --porcelain -- state.enc)" ]]; then
            echo 'Encrypted state unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- state.enc
          git commit -m 'update runtime state'
          git pull --rebase origin state
          git push origin HEAD:state
