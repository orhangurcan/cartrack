name: Add W212 Search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add_w212_search.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Checkout encrypted state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Add W212 search and migrate state
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          TELEGRAM_CHAT_ID: ${{ secrets.telegramid }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
          CARTRACK_STATE_FILE: .state/state.enc
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          import watcher

          new_search = {
            'key': 'owner_w212',
            'label': 'Mercedes-Benz E-Class W212',
            'search_url': 'https://car.encar.com/list/car?page=1&search=%7B%22type%22%3A%22car%22%2C%22action%22%3A%22%28And.Hidden.N._.MultiViewHidden.N._.SellType.%EC%9D%BC%EB%B0%98._.%28Or.Separation.B._.Separation.F.%29_.ServiceCopyCar.ORIGINAL._.FuelType.%EB%94%94%EC%A0%A4._.Mileage.range%28..110000%29._.%28C.CarType.N._.%28C.Manufacturer.%EB%B2%A4%EC%B8%A0._.%28C.ModelGroup.E-%ED%81%B4%EB%9E%98%EC%8A%A4._.%28C.Model.E-%ED%81%B4%EB%9E%98%EC%8A%A4%20W212._.%28Or.BadgeGroup.%EB%94%94%EC%A0%A4%202WD._.BadgeGroup.%EB%94%94%EC%A0%A4%204WD.%29%29%29%29%29_.Price.range%28..1200%29.%29%22%2C%22title%22%3A%22Mercedes-Benz%20E-Class%20W212%22%2C%22toggle%22%3A%7B%7D%2C%22layer%22%3A%22%22%2C%22sort%22%3A%22MobileModifiedDate%22%7D'
          }

          extra_path = Path('owner_extra_searches.json')
          extra = json.loads(extra_path.read_text(encoding='utf-8'))
          if any(x.get('key') == new_search['key'] for x in extra.get('searches', [])):
              raise SystemExit('W212 search already exists')
          new_extra = dict(extra)
          new_extra['searches'] = list(extra['searches']) + [new_search]

          base = json.loads(os.environ['SEARCHES_JSON'])
          merged = dict(base)
          merged['searches'] = list(base['searches']) + new_extra['searches']
          os.environ['SEARCHES_JSON'] = json.dumps(merged, ensure_ascii=False, separators=(',',':'))

          secret = watcher.state_secret()
          old_state = watcher.decrypt_state(watcher.STATE_FILE.read_bytes(), secret)
          preserved = {k:set(v.get('seen', [])) for k,v in old_state.get('searches',{}).items() if isinstance(v,dict)}
          if len(preserved) < 5:
              raise SystemExit(f'expected at least 5 existing histories, got {len(preserved)}')

          config = watcher.load_config()
          if len(config.searches) != 6:
              raise SystemExit(f'expected 6 searches, got {len(config.searches)}')

          old_state['config_fingerprint'] = watcher.config_fingerprint(config)
          watcher.save_state(old_state, secret)

          session = watcher.requests.Session()
          watcher.bootstrap(session)
          w212_spec = next(s for s in config.searches if s.key == 'owner_w212')
          current = watcher.fetch_search(session, w212_spec)
          watcher.run_watch(dry_run=False)

          new_state = watcher.load_state(watcher.config_fingerprint(config), secret)
          for key, hashes in preserved.items():
              if not hashes.issubset(set(new_state['searches'].get(key,{}).get('seen',[]))):
                  raise SystemExit(f'history lost for {key}')
          row = new_state['searches'].get('owner_w212',{})
          if row.get('initialized') is not True:
              raise SystemExit('W212 search not initialized')

          report = {
            'status':'OK',
            'w212_current_results':len(current),
            'w212_seen_count':len(row.get('seen',[])),
            'total_searches':len(config.searches),
            'existing_histories_preserved':True
          }
          Path('.state/w212-migration-report.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          extra_path.write_text(json.dumps(new_extra,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add owner_extra_searches.json
          git commit -m 'add W212 monitoring search'
          git push origin HEAD:main

          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.enc w212-migration-report.json
          git commit -m 'initialize W212 monitoring state'
          git pull --rebase origin state
          git push origin HEAD:state
