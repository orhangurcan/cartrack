name: Check Last 12 Hours

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag_last12h.yml'

permissions:
  actions: read
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - name: Read scheduled runs from last 12 hours
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          since = now - timedelta(hours=12)
          url=f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/cartrack.yml/runs?event=schedule&per_page=100"
          req=urllib.request.Request(url,headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'User-Agent':'cartrack-last12h'
          })
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          rows=[]
          for x in data.get('workflow_runs',[]):
              started=x.get('run_started_at') or x.get('created_at')
              if not started:
                  continue
              dt=datetime.fromisoformat(started.replace('Z','+00:00'))
              if dt >= since:
                  rows.append({
                      'id':x.get('id'),
                      'created_at':x.get('created_at'),
                      'run_started_at':x.get('run_started_at'),
                      'status':x.get('status'),
                      'conclusion':x.get('conclusion')
                  })
          out={'generated_at':now.isoformat(),'since':since.isoformat(),'runs':rows}
          open('.state/last12h-runs.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add last12h-runs.json
          git commit -m 'temporary last 12h run report'
          git push origin HEAD:state
