name: Migrate Four Searches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate_four_searches.yml'

concurrency:
  group: cartrack-${{ github.repository }}-schedule
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Checkout encrypted state
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Migrate state and initialize added searches
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          TELEGRAM_CHAT_ID: ${{ secrets.telegramid }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
          CARTRACK_STATE_FILE: .state/state.enc
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json, os
          base = json.loads(os.environ['SEARCHES_JSON'])
          extra = json.load(open('owner_extra_searches.json', encoding='utf-8'))
          if not isinstance(base.get('searches'), list) or not isinstance(extra.get('searches'), list):
              raise SystemExit('invalid search configuration')
          base['searches'] = base['searches'] + extra['searches']
          open('/tmp/merged-searches.json','w',encoding='utf-8').write(json.dumps(base, ensure_ascii=False, separators=(',',':')))
          PY
          export SEARCHES_JSON="$(cat /tmp/merged-searches.json)"

          python - <<'PY'
          import json
          from pathlib import Path
          import watcher

          secret = watcher.state_secret()
          state = watcher.decrypt_state(watcher.STATE_FILE.read_bytes(), secret)
          if state.get('version') != watcher.STATE_VERSION or not isinstance(state.get('searches'), dict):
              raise SystemExit('existing state is not safely migratable')
          original = {k: list(v.get('seen', [])) for k, v in state['searches'].items() if isinstance(v, dict)}
          if len(original) < 2:
              raise SystemExit('expected existing search history is missing')
          Path('/tmp/original-seen.json').write_text(json.dumps(original), encoding='utf-8')

          config = watcher.load_config()
          if len(config.searches) != 4:
              raise SystemExit(f'expected 4 searches, got {len(config.searches)}')
          state['config_fingerprint'] = watcher.config_fingerprint(config)
          watcher.save_state(state, secret)
          PY

          python watcher.py dry-run
          python watcher.py watch

          python - <<'PY'
          import json
          from pathlib import Path
          import watcher

          original = json.loads(Path('/tmp/original-seen.json').read_text(encoding='utf-8'))
          config = watcher.load_config()
          secret = watcher.state_secret()
          state = watcher.load_state(watcher.config_fingerprint(config), secret)

          for key, hashes in original.items():
              current = set(state['searches'].get(key, {}).get('seen', []))
              if not set(hashes).issubset(current):
                  raise SystemExit(f'existing history was lost for {key}')

          report = {'status':'OK','searches':[]}
          for spec in config.searches:
              row = state['searches'].get(spec.key, {})
              if row.get('initialized') is not True:
                  raise SystemExit(f'search not initialized: {spec.key}')
              report['searches'].append({
                  'key': spec.key,
                  'label': spec.label,
                  'seen_count': len(row.get('seen', [])),
                  'initialized': True,
              })
          Path('.state/search-migration-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- state.enc search-migration-report.json
          git commit -m 'initialize G30 and W213 monitoring state'
          git pull --rebase origin state
          git push origin HEAD:state
