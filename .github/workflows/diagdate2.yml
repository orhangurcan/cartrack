name: Encar Record Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagdate2.yml'

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Extract current Encar record
        env:
          SEARCHES_JSON: ${{ secrets.searchesjson }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.telegrambot }}
          STATE_ENCRYPTION_KEY: ${{ secrets.statekey }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, requests
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          import watcher

          PUB=b'''-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA7LSi9roC+Ft3MbqELvGy
          qkWwWHgc/Qqbrb1W8D4fE5ajMtID2qkFq2muCLtKCZT1aVq9RFNq09clJOcIr1fS
          i/5QbiUXvBKf+iKUPQE+gIHvHIbWrgKQGSWEclBG2bsrX8jKNNLYz4InOd9WAwUB
          vF/0wPl94Is7xIr0dNa1D1A71D3pgmo9Xxi6yD1j/lPdu8f6dz/25G/pFExYdcJt
          YNpxc61WxacDmvdvNMgjU9u4RYZhayP3CSPXLoJqUqoaO/mjGOHEdT4eMC00+Ocg
          ri/I0Fc720zxpIoHk3A3/Vq63wr9M6CpUzfdu5SDwrz3QsEIYK/WOVTBjY1FpggA
          8QIDAQAB
          -----END PUBLIC KEY-----'''

          config=watcher.load_config(); spec=config.searches[1]
          s=requests.Session(); watcher.bootstrap(s)
          listings=watcher.fetch_search(s,spec)
          car=next(c for c in listings if str(c.get('Id'))=='41886116')
          payload=json.dumps(car,ensure_ascii=False,separators=(',',':')).encode()
          aes=os.urandom(32); nonce=os.urandom(12)
          ct=AESGCM(aes).encrypt(nonce,payload,b'encar-record-v1')
          pub=serialization.load_pem_public_key(PUB)
          wrapped=pub.encrypt(aes,padding.OAEP(mgf=padding.MGF1(algorithm=hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          env={'k':base64.b64encode(wrapped).decode(),'n':base64.b64encode(nonce).decode(),'c':base64.b64encode(ct).decode()}
          open('.state/encar-record.enc','w',encoding='utf-8').write(json.dumps(env,separators=(',',':'))+'\n')
          PY
          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add encar-record.enc
          git commit -m 'temporary encrypted Encar record'
          git push origin HEAD:state
