name: Check Latest Schedule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag_latest_schedule.yml'

permissions:
  actions: read
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: state
          path: .state
          persist-credentials: true
      - name: Read latest schedule runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/cartrack.yml/runs?event=schedule&per_page=10"
          req=urllib.request.Request(url,headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],
              'Accept':'application/vnd.github+json',
              'User-Agent':'cartrack-latest-schedule'
          })
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          rows=[]
          for x in data.get('workflow_runs',[]):
              rows.append({
                  'id':x.get('id'),
                  'created_at':x.get('created_at'),
                  'run_started_at':x.get('run_started_at'),
                  'status':x.get('status'),
                  'conclusion':x.get('conclusion')
              })
          open('.state/latest-schedule-runs.json','w').write(json.dumps(rows,indent=2)+'\n')
          PY
          cd .state
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest-schedule-runs.json
          git commit -m 'temporary latest schedule report'
          git push origin HEAD:state
